# Hosted binding for the SEP-2640 skills server.
# Build the snapshot first, then deploy:
#   bun worker/build.ts && bunx wrangler deploy -c worker/wrangler.toml
name = "dotclaude-skills"
account_id = "9d1a8fe235b13dcab0fa3bcb6181ab0c"
main = "worker.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/public"
binding = "ASSETS"

# Product-level usage events (skill_used) go to PostHog when a project key
# is present. Forks: set your own with
#   bunx wrangler secret put POSTHOG_API_KEY -c worker/wrangler.toml
# No key means no emission — the worker no-ops it.
[vars]
POSTHOG_HOST = "https://us.i.posthog.com"

[observability]
enabled = true

# One datapoint per request: blobs = [method, skill, outcome, client-label,
# user-agent, country, colo], doubles = [latency_ms, response_bytes].
# Query with `bun metrics.ts` (Analytics Engine SQL API).
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "skills_mcp_usage"
