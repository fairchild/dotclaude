# Hosted binding for the SEP-2640 skills server.
# Source configuration for local development and package-backed Worker preparation.
# Production uses the tested artifact from CI; see docs/github-actions.md.
name = "dotclaude-skills"
# The Cloudflare account comes from CLOUDFLARE_ACCOUNT_ID — set it in the
# environment, in a gitignored mcp/.env (wrangler auto-loads it), or as a
# repository variable for CI. Forks bring their own account and route.
routes = [{ pattern = "skills.cloudcompute.com", custom_domain = true }]
workers_dev = false
main = "worker.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# Product-level usage events (skill_used) go to PostHog when a project key
# is present. Forks: set your own with
# From mcp/, after installing locked dependencies:
#   ./node_modules/.bin/wrangler secret put POSTHOG_API_KEY -c worker/wrangler.toml
# No key means no emission — the worker no-ops it.
[vars]
POSTHOG_HOST = "https://us.i.posthog.com"

[observability]
enabled = true

# One datapoint per request: blobs = [method, skill, outcome, client-label,
# user-agent, country, colo], doubles = [latency_ms, response_bytes].
# Query with `bun metrics.ts` (Analytics Engine SQL API).
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "skills_mcp_usage"
