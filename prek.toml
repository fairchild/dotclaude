[[repos]]
repo = "builtin"
hooks = [
    { id = "no-commit-to-branch", args = ["--branch", "main"] },
    { id = "check-json" },
    { id = "check-yaml" },
    { id = "check-toml" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "backlog-dep-validation", name = "backlog: validate dependencies", language = "system", entry = "bash skills/backlog/hooks/validate-deps.sh", files = '^backlog/.*\.md$', pass_filenames = true },
]
