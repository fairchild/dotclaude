# Template for the consequential-check skill. Copy it to .github/workflows/consequential-check.yml,
# and copy scripts/consequential.py and assets/rubric.md to .github/consequential/, on the default
# branch.
#
# The check is green when a model judged this head's diff and raised nothing. It fails when the
# owner should be the one to merge: a question raised, a verdict too close to call, nothing judged,
# or an earlier head that was raised and still carries the `consequential` label. A raised pull
# request gets that label, and one verdict comment is kept current. The workflow never merges,
# approves, or removes the label: a later push cannot clear a raise, only the owner can.
#
# The trigger is `pull_request_target`, so GitHub runs this file from the default branch, whatever
# branch the pull request targets, and a pull request cannot rewrite its own judge. The checkout
# has no `ref`, so the script and rubric come from the default branch too. No pull request code
# runs: only its diff, read through the API, reaches a model. The title and body never do.
#
# A public repository blocks `pull_request_target` by default from 2026-12-02. Allow the event for
# this file under Settings → Actions → Policies. A blocked run never starts, so the check is not
# green and the pull request stays the owner's to merge.
#
# A pull request from a fork gets no secrets and no model call, and fails: it is the owner's to
# merge.
#
# Secrets: TYPESAFE_API_KEY (Jev decides; without it a cheap Claude model does) and
# ANTHROPIC_API_KEY (the Claude models: the benchmark beside Jev, and Opus when a verdict is too
# close to call). Variable: JEV_MODEL, the exact Jev version the rubric was tuned against.
name: Consequential check

on:
  pull_request_target:
    # `edited` covers a changed base branch, which changes the diff without a push. It also fires
    # on a title or body edit, and that run judges again: a job skipped for it would report
    # success and replace a failing check.
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: consequential-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # No job-level `if`: a skipped job reports success, and this check must never pass unjudged.
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/consequential

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Read the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The API refuses very large diffs; an empty file leaves the PR to the owner.
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/pr.diff" || : > "$RUNNER_TEMP/pr.diff"

      # `shell: bash` adds pipefail, so a crash in the script fails this step instead of hiding
      # behind `tee`. The steps after it run on failure and treat a missing verdict as a raise.
      # A fork, or a head repository that no longer exists, gets empty keys and no model call.
      - name: Route
        id: route
        shell: bash
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          TYPESAFE_API_KEY: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.TYPESAFE_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.ANTHROPIC_API_KEY || '' }}
          JEV_MODEL: ${{ vars.JEV_MODEL }}
        run: |
          uv run --script .github/consequential/consequential.py \
            --rubric .github/consequential/rubric.md \
            --from-fork "$FROM_FORK" \
            --head "$HEAD" \
            --diff-file "$RUNNER_TEMP/pr.diff" \
            --comment-file "$RUNNER_TEMP/comment.md" \
            --summary-file "$GITHUB_STEP_SUMMARY" | tee "$RUNNER_TEMP/verdict.json"

      # Every model's answer per question, for comparing Jev with the benchmark across many PRs.
      - name: Keep the verdict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: consequential-verdict
          path: ${{ runner.temp }}/verdict.json
          if-no-files-found: ignore

      - name: Label
        if: ${{ !cancelled() && steps.route.outputs.consequential != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create consequential --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "The owner merges this one" 2>/dev/null || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label consequential

      - name: Post the verdict
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- consequential-check -->'
          if [ ! -s "$RUNNER_TEMP/comment.md" ]; then
            # shellcheck disable=SC2016  # the backticks are Markdown, not a command
            printf '%s\n**Consequential: yes** at `%s`\n\nThe router failed before reaching a verdict, so the owner merges this one. The run log has the error.\n\n<!-- agent-note -->\n' \
              "$marker" "${HEAD:0:12}" > "$RUNNER_TEMP/comment.md"
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "map(select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))) | .[0].id // empty" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          fi

      # The check is the signal. It passes only when this head was judged and nothing is raised,
      # on this head or an earlier one: the label outlives the push that earned it. A label that
      # cannot be read fails the step.
      - name: Fail when the owner merges
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CONSEQUENTIAL: ${{ steps.route.outputs.consequential }}
        run: |
          if [ "$CONSEQUENTIAL" != "false" ]; then
            echo "::error title=The owner merges this one::The verdict comment on the pull request says why."
            exit 1
          fi
          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if grep -qx consequential <<< "$labels"; then
            echo "::error title=The owner merges this one::An earlier head was raised and the consequential label is still on. The owner removes the label and re-runs this check, or merges."
            exit 1
          fi
