# Template for the consequential-check skill. Copy it to .github/workflows/consequential-check.yml,
# and copy scripts/consequential.py and assets/rubric.md to .github/consequential/ on the default
# branch.
#
# It labels a pull request `consequential` when the owner should be the one to merge it, and posts
# the verdict as one comment it keeps current. It never merges, approves, or removes the label: a
# later push cannot clear a raise, only the owner can.
#
# The script and rubric run from the base commit, so a pull request cannot rewrite its own judge.
# The diff is read through the API as data. Pull requests from forks get no secrets and a read-only
# token, so they are skipped; a fork's PR is the owner's to merge regardless.
#
# Jev decides; a cheap Claude model answers the same questions beside it as a benchmark, and every
# model's answers land in the `consequential-verdict` artifact and the job summary. A Jev/benchmark
# disagreement shows as a warning, a line in the summary and a line in the comment.
#
# Secrets: TYPESAFE_API_KEY (Jev; without it the benchmark model decides, as before Jev), and
# ANTHROPIC_API_KEY (the benchmark and the stronger model). Variable: JEV_MODEL, set to the exact
# Jev version the rubric was tuned against.
name: Consequential check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: consequential-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/consequential

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Read the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # The API refuses very large diffs; an empty file routes the PR to the owner.
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/pr.diff" || : > "$RUNNER_TEMP/pr.diff"
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"

      # `shell: bash` adds pipefail, so a crash in the script fails this step instead of hiding
      # behind `tee`. The steps after it run on failure and treat a missing verdict as a raise.
      - name: Route
        id: route
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_MODEL: ${{ vars.JEV_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run --script .github/consequential/consequential.py \
            --rubric .github/consequential/rubric.md \
            --title "$TITLE" \
            --head "$HEAD" \
            --body-file "$RUNNER_TEMP/body.md" \
            --diff-file "$RUNNER_TEMP/pr.diff" \
            --comment-file "$RUNNER_TEMP/comment.md" \
            --summary-file "$GITHUB_STEP_SUMMARY" | tee "$RUNNER_TEMP/verdict.json"

      # Every model's answer per question, for comparing Jev with the benchmark across many PRs.
      - name: Keep the verdict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: consequential-verdict
          path: ${{ runner.temp }}/verdict.json
          if-no-files-found: ignore

      - name: Label
        if: ${{ !cancelled() && steps.route.outputs.consequential != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create consequential --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "The owner merges this one" 2>/dev/null || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label consequential

      - name: Post the verdict
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- consequential-check -->'
          if [ ! -s "$RUNNER_TEMP/comment.md" ]; then
            printf '%s\n**Consequential: yes** at `%s`\n\nThe router failed before reaching a verdict; routed to the owner. The run log has the error.\n\n<!-- agent-note -->\n' \
              "$marker" "${HEAD:0:12}" > "$RUNNER_TEMP/comment.md"
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          fi
