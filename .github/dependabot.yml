# VERSION UPDATES ARE OFF: every entry sets `open-pull-requests-limit: 0`,
# which GitHub documents as disabling version-update PRs for that package
# manager. Dependabot alerts and security updates are off in this
# repository's settings too, and every action under .github/workflows is
# pinned to a commit SHA, so nothing here moves an action automatically:
# a pin changes only when someone changes it.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ['*']
