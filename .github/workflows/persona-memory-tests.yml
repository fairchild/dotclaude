name: Persona Memory Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/persona-memory/**'
      - '.github/workflows/persona-memory-tests.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  persona-memory-deterministic:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: skills/persona-memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run deterministic harness
        run: bun tests/harness.ts --suite deterministic --report text

  persona-memory-live-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    defaults:
      run:
        working-directory: skills/persona-memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run live smoke harness
        env:
          AI_MEMORY_TEST_LIVE: '1'
          AI_MEMORY_TEST_PROVIDER: 'anthropic'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun tests/harness.ts --suite live --report json

      - name: Upload live report artifact
        uses: actions/upload-artifact@v4
        with:
          name: persona-memory-live-report
          path: skills/persona-memory/tests/.artifacts/live-report.json
          if-no-files-found: warn
