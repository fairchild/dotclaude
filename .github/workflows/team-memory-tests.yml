name: Team Memory Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "skills/team-memory/**"
      - "agents/team-memory-sleep.md"
      - "settings.json"
      - ".github/workflows/team-memory-tests.yml"
  workflow_dispatch:

jobs:
  team-memory-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n skills/team-memory/scripts/init.sh
          bash -n skills/team-memory/scripts/launch.sh
          bash -n skills/team-memory/scripts/session-end.sh
          bash -n skills/team-memory/tests/regression.sh

      - name: Run regression harness
        run: bash skills/team-memory/tests/regression.sh
