name: Analyze Usage Tests

on:
  pull_request:
    paths:
      - '.github/workflows/analyze-usage-tests.yml'
      - 'skills/analyze-usage/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-usage-tests.yml'
      - 'skills/analyze-usage/**'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.14'
          enable-cache: false

      - name: Install DuckDB CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://install.duckdb.org/v1.5.4/duckdb_cli-linux-amd64.zip \
            --output /tmp/duckdb.zip
          echo '1f2fa724fb054b3dbe1a9cbd13de5b76997d850e7087ec762ba88db04e0180cf  /tmp/duckdb.zip' \
            | sha256sum --check
          unzip -q /tmp/duckdb.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate shell syntax
        run: bash -n skills/analyze-usage/scripts/analyze-usage

      - name: Run ingestion and report regressions
        run: uv run skills/analyze-usage/tests/test_analyze_usage.py
