name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      config: ${{ steps.paths.outputs.config }}
      package: ${{ steps.paths.outputs.package }}
      webui: ${{ steps.paths.outputs.webui }}
      analyze: ${{ steps.paths.outputs.analyze }}
      persona: ${{ steps.paths.outputs.persona }}
      team: ${{ steps.paths.outputs.team }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        run: node .github/scripts/changes.mjs
      - run: node --test .github/scripts/paths.test.mjs
  config:
    needs: changes
    if: needs.changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Actions syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.14'
          enable-cache: false
      - run: |
          uv venv
          uv pip install jsonschema==4.26.0 pyyaml==6.0.3
          . .venv/bin/activate
          python .github/scripts/validate-config.py
          python .github/scripts/test-workflows.py
          python scripts/catalog.py readme --check
          python scripts/portability.py --check
          python scripts/test_portability.py
          for fixture in .github/fixtures/*.invalid.json; do
            if python .github/scripts/validate-config.py --settings-only "$fixture"; then exit 1; fi
          done
          scripts/test-participant-contract.sh
          bash skills/agent-inbox/scripts/test-hooks.sh
          python skills/image-gen/scripts/check_protocol.py
  package:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    uses: ./.github/workflows/verify-skill-server.yml
  webui:
    needs: changes
    if: needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
        working-directory: webui
      - run: bun webui/scan.ts --skip-validation
        env:
          CLAUDE_DIR: .
      - run: node .github/scripts/package-webui.mjs
      - run: ./node_modules/.bin/playwright install --with-deps chromium && ./node_modules/.bin/playwright test
        working-directory: webui
        env:
          WEBUI_ROOT: ${{ github.workspace }}/webui-release/public
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webui-${{ github.sha }}
          path: webui-release/
          if-no-files-found: error
          retention-days: 14
  gate:
    name: CI
    if: always()
    needs: [changes, config, package, webui, analyze, persona, team]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const r=JSON.parse(process.env.RESULTS); if(r.changes.result!=="success" || Object.values(r).some(j=>!["success","skipped"].includes(j.result))) process.exit(1)'
  deploy-skills:
    needs: [gate, package]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.package.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: skills-production
      url: https://skills.cloudcompute.com
    concurrency:
      group: skills-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
        working-directory: mcp
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skills-worker-${{ github.sha }}
          path: deployed
      - run: node .github/scripts/deployment-current.mjs package
        env:
          GH_TOKEN: ${{ github.token }}
      - run: ../mcp/node_modules/.bin/wrangler deploy --config wrangler.toml
        working-directory: deployed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      - run: node .github/scripts/verify-deployment.mjs https://skills.cloudcompute.com skills
  deploy-webui:
    needs: [gate, webui]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.webui.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: webui-production
      url: https://claude.cloudcompute.com
    concurrency:
      group: webui-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
        working-directory: mcp
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webui-${{ github.sha }}
          path: deployed
      - run: node .github/scripts/deployment-current.mjs webui
        env:
          GH_TOKEN: ${{ github.token }}
      - run: ../mcp/node_modules/.bin/wrangler deploy --config wrangler.toml
        working-directory: deployed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      - run: node .github/scripts/verify-deployment.mjs https://claude.cloudcompute.com webui

  analyze:
    needs: changes
    if: needs.changes.outputs.analyze == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.14'
          enable-cache: false

      - name: Install DuckDB CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://install.duckdb.org/v1.5.4/duckdb_cli-linux-amd64.zip \
            --output /tmp/duckdb.zip
          echo '1f2fa724fb054b3dbe1a9cbd13de5b76997d850e7087ec762ba88db04e0180cf  /tmp/duckdb.zip' \
            | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          unzip -q /tmp/duckdb.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate shell syntax
        run: bash -n skills/analyze-usage/scripts/analyze-usage

      - name: Run ingestion and report regressions
        run: uv run skills/analyze-usage/tests/test_analyze_usage.py

  team:
    needs: changes
    if: needs.changes.outputs.team == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate shell syntax
        run: |
          bash -n skills/team-memory/scripts/init.sh
          bash -n skills/team-memory/scripts/launch.sh
          bash -n skills/team-memory/scripts/session-end.sh
          bash -n skills/team-memory/tests/regression.sh

      - name: Run regression harness
        run: bash skills/team-memory/tests/regression.sh

  persona:
    needs: changes
    if: needs.changes.outputs.persona == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: skills/persona-memory

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run deterministic harness
        run: bun tests/harness.ts --suite deterministic --report text
