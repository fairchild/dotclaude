name: Release skill-server candidate
on:
  push:
    tags: ['skill-server-v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate version and ancestry
        working-directory: mcp
        run: |
          node -e 'const p=require("./package.json"); if(!/^\d+\.\d+\.\d+-rc\.\d+$/.test(p.version) || process.env.GITHUB_REF_NAME!=="skill-server-v"+p.version) process.exit(1)'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  candidate:
    needs: validate-tag
    uses: ./.github/workflows/verify-skill-server.yml
  publish:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: skill-server-${{ github.sha }}
          path: candidate
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: candidate/*.tgz
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" candidate/*.tgz candidate/SHA256SUMS candidate/source.json \
            --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes-file candidate/RELEASE.md
