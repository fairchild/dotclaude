name: Release skill-server
# Called by ci.yml after deploy-skills, when release-check finds the package version unreleased.
# It publishes the tarball this run verified and deployed, so the release is what serves.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skill-server-${{ github.sha }}
          path: candidate
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: candidate/*.tgz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(jq -r .version candidate/source.json)
          prerelease=""
          [[ "$version" == *-* ]] && prerelease=--prerelease
          gh release create "skill-server-v$version" candidate/*.tgz candidate/SHA256SUMS candidate/source.json \
            --target "$GITHUB_SHA" $prerelease --title "skill-server-v$version" --notes-file candidate/RELEASE.md
