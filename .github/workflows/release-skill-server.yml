name: Release skill-server candidate
on:
  push:
    tags: ['skill-server-v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate version and ancestry
        working-directory: mcp
        run: |
          node -e 'const p=require("./package.json"); if(!/^\d+\.\d+\.\d+-rc\.\d+$/.test(p.version) || process.env.GITHUB_REF_NAME!=="skill-server-v"+p.version) process.exit(1)'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  candidate:
    needs: validate-tag
    uses: ./.github/workflows/verify-skill-server.yml
  publish:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skill-server-${{ github.sha }}
          path: candidate
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: candidate/*.tgz
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" candidate/*.tgz candidate/SHA256SUMS candidate/source.json \
            --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes-file candidate/RELEASE.md
