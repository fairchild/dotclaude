name: Release skill-server candidate
on:
  push:
    tags: ['skill-server-v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify candidate version and ancestry
        run: |
          node -e 'const p=require("./package.json"); if(!/^\d+\.\d+\.\d+-rc\.\d+$/.test(p.version) || process.env.GITHUB_REF_NAME!=="skill-server-v"+p.version) process.exit(1)'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test conformance && bun run build:package
      - run: bun run test:package
        env:
          PACKAGE_OUTPUT_DIR: out
      - run: node scripts/prepare-worker.mjs out/*.tgz && node scripts/check-worker.mjs
      - run: node scripts/release-evidence.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: mcp/out/
          if-no-files-found: error
  consumer:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: candidate
      - shell: bash
        run: node mcp/scripts/test-package.mjs candidate/*.tgz
  publish:
    needs: [candidate, consumer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: candidate
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: candidate/*.tgz
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" candidate/*.tgz candidate/SHA256SUMS candidate/source.json \
            --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes-file candidate/RELEASE.md
