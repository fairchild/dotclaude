name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Was gated on a 'needs code review' label nobody applied — 100 skipped runs
    # out of 100. Runs on every non-draft PR now.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR following the style in .github/copilot-instructions.md.

            ## Step 1: Check Previous Review Comments
            First, fetch all existing review threads:
            ```bash
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments
            ```

            For each unresolved comment from a previous review:
            - Check if the issue has been fixed in the current code
            - If fixed, resolve the thread using GraphQL:
              ```bash
              gh api graphql -f query='mutation { resolveReviewThread(input: {threadId: "THREAD_ID"}) { thread { isResolved } } }'
              ```

            ## Step 2: Review Current Code
            For each NEW issue found, post an INLINE comment using:
            `mcp__github_inline_comment__create_inline_comment`

            Include a code suggestion block when you have a fix:
            ```suggestion
            // fixed code here
            ```

            Use terse labels: `Bug:`, `Security:`, `Perf:`

            ## Step 3: Submit GitHub Review
            After reviewing all files, determine your score (1-5).

            Submit a formal GitHub PR review:
            - If score >= 4: Submit APPROVE
              ```bash
              gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
                -f event="APPROVE" \
                -f body="**Score: X/5** [confidence: level] - summary"
              ```
            - If score <= 3: Submit REQUEST_CHANGES (blocks merging)
              ```bash
              gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
                -f event="REQUEST_CHANGES" \
                -f body="**Score: X/5** [confidence: level] - summary"
              ```

            ## Step 4: Update Labels and PR Description
            1. Append score to PR description:
               `gh pr edit --body "$(gh pr view --json body -q .body)\n\n---\n**Review Score: X/5** [confidence]\n<summary>"`

            2. Update labels:
               - Always remove `needs code review` label
               - If score >= 4, add `code review passed` label
               Use: `gh pr edit --remove-label "needs code review" --add-label "code review passed"`
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh api:*),Read,Glob,Grep"

      - name: Check Review Result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REVIEW_STATE=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            --jq '[.[] | select(.user.login == "claude[bot]")] | last | .state')

          echo "Latest Claude review state: ${REVIEW_STATE:-<none>}"

          # A missing review used to fall through to "Code review passed" — the
          # check reported success in precisely the case where nothing had been
          # reviewed. Distinguish the one legitimate reason for a missing review
          # from the failure it otherwise is.
          if [ -z "$REVIEW_STATE" ] || [ "$REVIEW_STATE" = "null" ]; then
            # claude-code-action refuses to run when the PR changes a workflow
            # file, requiring the workflow to match the default branch —
            # otherwise a PR could rewrite the reviewer's own prompt. Expected.
            if gh pr diff ${{ github.event.pull_request.number }} --name-only \
                 | grep -q '^\.github/workflows/'; then
              echo "::notice::No Claude review — expected, this PR changes workflow files."
              exit 0
            fi
            echo "::error::No review from claude[bot]. The reviewer did not run; check the 'Run Claude Code Review' step."
            exit 1
          fi

          if [ "$REVIEW_STATE" = "CHANGES_REQUESTED" ]; then
            # Advisory until this reviewer has demonstrated it works. Swap the
            # warning for `exit 1` to make a low score block merges as designed.
            echo "::warning::Claude requested changes (score <= 3) — advisory, not blocking."
            exit 0
          fi
          echo "Code review passed (state: $REVIEW_STATE)"

