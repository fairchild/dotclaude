name: Claude Code Review

on:
  pull_request:
    # `labeled` was here for the 'needs code review' gate, dropped in #245.
    # It now only fires when the reviewer applies its own 'code review passed'
    # label at the end of a review — re-running this workflow with a bot actor.
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

permissions:
  contents: read
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  claude-review:
    # Was gated on a 'needs code review' label nobody applied — 100 skipped runs
    # out of 100. Runs on every non-draft PR now.
    #
    # The Bot guard is belt-and-braces alongside dropping the `labeled` trigger:
    # claude-code-action refuses a run whose actor is a bot ("Workflow initiated
    # by non-human actor") and exits 1, so any self-retrigger fails the check
    # rather than being skipped. Cheaper to not start than to fail.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@fa2b2666b747000bf42767d1f332065b375e3c8f # v1.0.214
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review the current PR head following .github/copilot-instructions.md.
            Check existing inline findings first; resolve only those fixed in the current code.
            Post actionable new findings inline with suggestions where useful.
            Submit a formal review against the current head SHA with a 1-5 score,
            confidence, findings, and checks actually run. Score >=4 means APPROVE;
            lower scores mean REQUEST_CHANGES. This review remains advisory in CI.
            Update the code review passed label to reflect the result, and remove
            needs code review if present. Do not modify the PR description.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh api:*),Read,Glob,Grep"

      - name: Check Review Result
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          REVIEW_STATE=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            --jq "[.[] | select(.user.login == \"claude[bot]\" and .commit_id == \"$PR_HEAD\")] | last | .state")

          echo "Latest Claude review state: ${REVIEW_STATE:-<none>}"

          # A missing review used to fall through to "Code review passed" — the
          # check reported success in precisely the case where nothing had been
          # reviewed. Distinguish the one legitimate reason for a missing review
          # from the failure it otherwise is.
          if [ -z "$REVIEW_STATE" ] || [ "$REVIEW_STATE" = "null" ]; then
            # claude-code-action refuses to run when the PR changes a workflow
            # file, requiring the workflow to match the default branch —
            # otherwise a PR could rewrite the reviewer's own prompt. Expected.
            if gh pr diff ${{ github.event.pull_request.number }} --name-only \
                 | grep -q '^\.github/workflows/'; then
              echo "::notice::No Claude review — expected, this PR changes workflow files."
              exit 0
            fi
            echo "::error::No review from claude[bot]. The reviewer did not run; check the 'Run Claude Code Review' step."
            exit 1
          fi

          if [ "$REVIEW_STATE" = "CHANGES_REQUESTED" ]; then
            # Advisory until this reviewer has demonstrated it works. Swap the
            # warning for `exit 1` to make a low score block merges as designed.
            echo "::warning::Claude requested changes (score <= 3) — advisory, not blocking."
            exit 0
          fi
          echo "Code review passed (state: $REVIEW_STATE)"
