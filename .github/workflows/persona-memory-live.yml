name: Persona Memory Live
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
permissions:
  contents: read
jobs:
  persona-memory-live-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: skills/persona-memory

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run live smoke harness
        env:
          AI_MEMORY_TEST_LIVE: '1'
          AI_MEMORY_TEST_PROVIDER: 'anthropic'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun tests/harness.ts --suite live --report json

      - name: Upload live report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: persona-memory-live-report
          path: skills/persona-memory/tests/.artifacts/live-report.json
          if-no-files-found: warn
