name: Verify skill-server package
on:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test conformance && bun run build:package
      - run: bun run test:package
        env:
          PACKAGE_OUTPUT_DIR: out
      - run: node scripts/release-evidence.mjs
      - run: node scripts/prepare-worker.mjs out/*.tgz
      - run: node scripts/check-worker.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-server-${{ github.sha }}
          path: mcp/out/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skills-worker-${{ github.sha }}
          path: |
            mcp/.worker-package/dist/public/
            mcp/.worker-package/bundle/
            mcp/.worker-package/wrangler.toml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  consumer:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: skill-server-${{ github.sha }}
          path: candidate
      - shell: bash
        run: node mcp/scripts/test-package.mjs candidate/*.tgz
