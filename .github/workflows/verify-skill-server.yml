name: Verify skill-server package
on:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/bun.lock
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test conformance && bun run build:package
      - run: bun run test:package
        env:
          PACKAGE_OUTPUT_DIR: out
      - run: node scripts/release-evidence.mjs
      - run: node scripts/prepare-worker.mjs out/*.tgz
      - run: node scripts/check-worker.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-server-${{ github.sha }}
          path: mcp/out/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skills-worker-${{ github.sha }}
          path: |
            mcp/.worker-package/dist/public/
            mcp/.worker-package/bundle/
            mcp/.worker-package/wrangler.toml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  consumer:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        # PR feedback stays fast; main, tags and manual CI retain Windows.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
        node: ['22', '24']
        include:
          - os: ubuntu-latest
            node: '22.14.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp/bun.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skill-server-${{ github.sha }}
          path: candidate
      - shell: bash
        run: node mcp/scripts/test-package.mjs candidate/*.tgz
